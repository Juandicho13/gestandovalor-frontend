<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados de búsqueda - GestandoValor</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0B132B',
                        gold: '#D4AF37',
                        lightGray: '#F9FAFB'
                    }
                }
            }
        }
    </script>
    <style>
        .flatpickr-calendar {
            border-radius: 24px !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2) !important;
            border: none !important;
            padding: 20px !important;
            font-family: sans-serif;
            z-index: 9999 !important;
        }

        .flatpickr-day.selected,
        .flatpickr-day.startRange,
        .flatpickr-day.endRange {
            background: #0B132B !important;
            border-color: #0B132B !important;
            font-weight: bold;
            color: white !important;
        }

        .flatpickr-day.inRange {
            box-shadow: -5px 0 0 #f3f4f6, 5px 0 0 #f3f4f6 !important;
            background: #f3f4f6 !important;
            border-color: #f3f4f6 !important;
            color: #0B132B !important;
        }

        .flatpickr-day.today {
            border-color: #D4AF37 !important;
            font-weight: bold;
        }
    </style>
</head>

<body class="font-sans text-gray-800 antialiased bg-white" x-data="resultadosApp()" x-init="initApp()">

    <div x-show="cargando" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-gold mb-4"></div>
        <p class="font-bold text-navy animate-pulse">Buscando los mejores alojamientos...</p>
    </div>

    <nav id="navbar"
        class="fixed top-0 left-1/2 transform -translate-x-1/2 z-50 flex items-center justify-between transition-all duration-700 ease-[cubic-bezier(0.25,1,0.5,1)] backdrop-blur-md overflow-visible border-white/10 w-full max-w-full h-24 rounded-none px-4 md:px-10 border-b bg-navy/90 shadow-sm">

        <a href="index.html" class="flex items-center transition-all duration-700 flex-shrink-0 w-[50px] md:w-[120px]">
            <img id="nav-logo-combined" src="GV.png" alt="Logo"
                class="h-16 w-auto object-contain transition-all duration-700">
        </a>

        <div class="flex-1 flex justify-center mx-2 md:mx-4 transition-all duration-700 z-[60]">
            <div
                class="flex items-center bg-white/5 border border-white/10 shadow-sm rounded-full py-1.5 md:py-2 px-2 md:px-4 backdrop-blur-sm relative">

                <div class="relative cursor-pointer px-2 md:px-4 border-r border-white/20 text-gray-300 hover:text-gold transition-colors duration-300 flex items-center h-full group"
                    @click.stop="openLocation = !openLocation; openGuests = false">
                    <div class="text-[10px] md:text-sm font-bold truncate max-w-[80px] md:max-w-[120px]"
                        x-text="filtros.loc || 'Destino'"></div>

                    <div x-show="openLocation" @click.away="openLocation = false" x-transition.opacity
                        class="absolute top-[180%] left-0 w-64 bg-white rounded-2xl shadow-2xl py-2 z-50 border border-gray-100 text-left text-navy cursor-default"
                        style="display: none;">
                        <template x-for="lugar in lugaresDisponibles" :key="lugar">
                            <div @click.stop="filtros.loc = lugar; openLocation = false; aplicarFiltrosYURL();"
                                class="px-6 py-3 hover:bg-gray-50 font-bold cursor-pointer transition-colors border-b border-gray-50 last:border-0"
                                x-text="lugar"></div>
                        </template>
                        <div x-show="lugaresDisponibles.length === 0" class="px-6 py-3 text-gray-400 text-sm">Cargando
                            destinos...</div>
                    </div>
                </div>

                <div id="nav-datepicker-trigger"
                    class="relative cursor-pointer px-2 md:px-4 border-r border-white/20 text-gray-300 hover:text-gold transition-colors duration-300 flex items-center h-full group">
                    <div class="text-[10px] md:text-sm font-bold whitespace-nowrap" x-text="textoFechas()"></div>
                    <input id="nav-calendar" type="text"
                        class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                </div>

                <div class="relative cursor-pointer px-2 md:px-4 text-gray-300 hover:text-gold transition-colors duration-300 flex items-center h-full group"
                    @click.stop="openGuests = !openGuests; openLocation = false">
                    <div class="text-[10px] md:text-sm font-bold whitespace-nowrap"
                        x-text="filtros.pax > 0 ? `${filtros.pax} huéspedes` : '¿Cuántos?'"></div>

                    <div x-show="openGuests" @click.away="openGuests = false" x-transition.opacity
                        class="absolute top-[180%] right-0 md:left-0 w-[300px] md:w-[350px] bg-white rounded-[32px] shadow-2xl p-6 z-50 border border-gray-100 text-left text-navy cursor-default"
                        style="display: none;">
                        <div class="flex justify-between items-center pb-4 border-b border-gray-100">
                            <div>
                                <div class="font-bold">Adultos</div>
                                <div class="text-xs text-gray-500">Edad 13+</div>
                            </div>
                            <div class="flex gap-3 items-center">
                                <button @click.stop="tempAdults > 0 ? tempAdults-- : null"
                                    class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center hover:border-gold hover:text-gold transition-colors">-</button>
                                <span x-text="tempAdults" class="font-extrabold w-4 text-center"></span>
                                <button @click.stop="tempAdults++"
                                    class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center hover:border-gold hover:text-gold transition-colors">+</button>
                            </div>
                        </div>
                        <div class="flex justify-between items-center py-4 border-b border-gray-100">
                            <div>
                                <div class="font-bold">Niños</div>
                                <div class="text-xs text-gray-500">Edades 2 – 12</div>
                            </div>
                            <div class="flex gap-3 items-center">
                                <button @click.stop="tempChildren > 0 ? tempChildren-- : null"
                                    class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center hover:border-gold hover:text-gold transition-colors">-</button>
                                <span x-text="tempChildren" class="font-extrabold w-4 text-center"></span>
                                <button @click.stop="tempChildren++"
                                    class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center hover:border-gold hover:text-gold transition-colors">+</button>
                            </div>
                        </div>
                        <div class="flex justify-between items-center py-4 border-b border-gray-100">
                            <div>
                                <div class="font-bold">Bebés</div>
                                <div class="text-xs text-gray-500">Menos de 2 años</div>
                            </div>
                            <div class="flex gap-3 items-center">
                                <button @click.stop="tempInfants > 0 ? tempInfants-- : null"
                                    class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center hover:border-gold hover:text-gold transition-colors">-</button>
                                <span x-text="tempInfants" class="font-extrabold w-4 text-center"></span>
                                <button @click.stop="tempInfants++"
                                    class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center hover:border-gold hover:text-gold transition-colors">+</button>
                            </div>
                        </div>
                        <div class="flex justify-between items-center py-4 border-b border-gray-100">
                            <div>
                                <div class="font-bold">Mascotas</div>
                                <div class="text-xs text-gray-500 underline">¿Traes un animal?</div>
                            </div>
                            <div class="flex gap-3 items-center">
                                <button @click.stop="tempPets > 0 ? tempPets-- : null"
                                    class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center hover:border-gold hover:text-gold transition-colors">-</button>
                                <span x-text="tempPets" class="font-extrabold w-4 text-center"></span>
                                <button @click.stop="tempPets++"
                                    class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center hover:border-gold hover:text-gold transition-colors">+</button>
                            </div>
                        </div>
                        <div class="pt-4 flex justify-end">
                            <button @click.stop="aplicarHuespedes()"
                                class="bg-navy hover:bg-gray-800 text-white font-bold py-2 px-6 rounded-xl transition-colors shadow-md">Aplicar</button>
                        </div>
                    </div>
                </div>

                <button @click.stop="aplicarFiltrosYURL()"
                    class="bg-gold hover:bg-yellow-500 rounded-full p-1.5 md:p-2 ml-1 md:ml-2 text-navy transition-colors shrink-0 shadow-sm hover:scale-105">
                    <svg class="w-3 h-3 md:w-4 md:h-4" fill="none" stroke="currentColor" stroke-width="3"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="w-[50px] md:w-[120px] flex-shrink-0 hidden sm:block"></div>
    </nav>

    <main class="pt-32 pb-16 max-w-[1400px] mx-auto px-6 lg:px-12" x-show="!cargando" style="display: none;">

        <h1 class="text-2xl font-extrabold text-navy mb-6 mt-4"
            x-text="`${propiedadesFiltradas.length} alojamiento${propiedadesFiltradas.length !== 1 ? 's' : ''} encontrado${propiedadesFiltradas.length !== 1 ? 's' : ''}`">
        </h1>

        <div x-show="propiedadesFiltradas.length === 0"
            class="text-center py-20 bg-gray-50 rounded-[40px] border border-dashed border-gray-200">
            <svg class="w-16 h-16 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <h3 class="text-xl font-bold text-navy">No encontramos suites con esos criterios</h3>
            <p class="text-gray-500 mt-2">Intenta cambiar las fechas, el destino o reducir la cantidad de huéspedes.</p>
            <button @click="limpiarFiltros()"
                class="inline-block mt-6 px-6 py-3 bg-navy text-white rounded-full font-bold hover:bg-gray-800 transition-colors">Borrar
                filtros</button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-6 gap-y-10"
            x-show="propiedadesFiltradas.length > 0">
            <template x-for="prop in propiedadesFiltradas" :key="prop.id">
                <a :href="`suite.html?id=${prop.id}&in=${filtros.in}&out=${filtros.out}&pax=${filtros.pax}`"
                    class="group cursor-pointer flex flex-col">
                    <div class="relative w-full aspect-[4/3] rounded-[24px] overflow-hidden mb-4 bg-gray-200">
                        <img :src="prop.fotos && prop.fotos.length > 0 ? prop.fotos[0] : 'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=800&q=80'"
                            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute inset-0 bg-black/10 group-hover:bg-transparent transition-colors"></div>
                        <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-extrabold text-navy shadow-sm"
                            x-text="prop.tipo_propiedad"></div>
                        <button class="absolute top-3 right-3 text-white hover:text-gold transition-colors z-10"><svg
                                class="w-7 h-7 drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                            </svg></button>
                    </div>
                    <div class="flex justify-between items-start">
                        <div class="pr-2">
                            <h3 class="font-extrabold text-navy text-lg leading-tight line-clamp-1"
                                x-text="`${prop.ciudad}, ${prop.departamento}`"></h3>
                            <p class="text-gray-500 text-sm mt-1" x-text="`${prop.camas} camas · ${prop.banos} baños`">
                            </p>
                            <p class="text-gray-500 text-sm truncate" x-text="prop.titulo"></p>
                            <div class="mt-2 flex items-baseline gap-1">
                                <span class="font-extrabold text-navy text-lg"
                                    x-text="formatearDinero(prop.precio_noche)"></span>
                                <span class="text-gray-600 text-sm">COP noche</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 text-sm font-bold text-navy shrink-0">
                            <svg class="w-4 h-4 text-gold" fill="currentColor" viewBox="0 0 20 20">
                                <path
                                    d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                            </svg>
                            <span>5.0</span>
                        </div>
                    </div>
                </a>
            </template>
        </div>
    </main>

    <script>
        function resultadosApp() {
            return {
                cargando: true,
                todasPropiedades: [],
                propiedadesFiltradas: [],
                lugaresDisponibles: [],

                openLocation: false,
                openGuests: false,

                // Contadores temporales para el menú de huéspedes
                tempAdults: 0,
                tempChildren: 0,
                tempInfants: 0,
                tempPets: 0,

                fp: null,

                filtros: {
                    loc: '',
                    in: '',
                    out: '',
                    pax: 0
                },

                async initApp() {
                    this.activarNavbarDinamica();
                    this.leerFiltrosURL();

                    // Si viene con huéspedes en la URL, se los ponemos a los adultos temporales
                    if (this.filtros.pax > 0) this.tempAdults = this.filtros.pax;

                    await this.cargarDesdeBD();
                    this.extraerUbicacionesUnicas();
                    this.initCalendario();
                },

                leerFiltrosURL() {
                    const params = new URLSearchParams(window.location.search);
                    this.filtros.loc = params.get('loc') || '';
                    this.filtros.in = params.get('in') || '';
                    this.filtros.out = params.get('out') || '';
                    this.filtros.pax = parseInt(params.get('pax')) || 0;
                },

                initCalendario() {
                    this.fp = flatpickr("#nav-calendar", {
                        mode: "range",
                        minDate: "today",
                        dateFormat: "Y-m-d",
                        locale: "es",
                        showMonths: window.innerWidth > 768 ? 2 : 1,
                        defaultDate: [this.filtros.in, this.filtros.out].filter(Boolean),
                        onChange: (selectedDates, dateStr, instance) => {
                            if (selectedDates.length === 2) {
                                this.filtros.in = instance.formatDate(selectedDates[0], "Y-m-d");
                                this.filtros.out = instance.formatDate(selectedDates[1], "Y-m-d");
                                this.aplicarFiltrosYURL();
                            } else {
                                this.filtros.in = '';
                                this.filtros.out = '';
                            }
                        }
                    });

                    const triggerDiv = document.getElementById('nav-datepicker-trigger');
                    if (triggerDiv) {
                        triggerDiv.addEventListener('click', () => {
                            this.openLocation = false;
                            this.openGuests = false;
                            this.fp.open();
                        });
                    }
                },

                async cargarDesdeBD() {
                    try {
                        const response = await fetch('https://gestandovalor-backend.onrender.com/propiedades');
                        if (response.ok) {
                            this.todasPropiedades = await response.json();
                            this.aplicarFiltros();
                        }
                    } catch (error) {
                        console.error('Error cargando propiedades:', error);
                    } finally {
                        this.cargando = false;
                    }
                },

                extraerUbicacionesUnicas() {
                    const lugaresSet = new Set();
                    this.todasPropiedades.forEach(p => {
                        if (p.ciudad) {
                            const str = p.departamento ? `${p.ciudad}, ${p.departamento}` : p.ciudad;
                            lugaresSet.add(str);
                        }
                    });
                    this.lugaresDisponibles = Array.from(lugaresSet).sort();
                },

                // Esta función se ejecuta SOLO cuando le dan al botón "Aplicar"
                aplicarHuespedes() {
                    // Calculamos el total y lo pasamos al filtro real
                    this.filtros.pax = this.tempAdults + this.tempChildren;
                    this.openGuests = false;
                    this.aplicarFiltrosYURL();
                },

                aplicarFiltrosYURL() {
                    const url = new URL(window.location);
                    if (this.filtros.loc) url.searchParams.set('loc', this.filtros.loc); else url.searchParams.delete('loc');
                    if (this.filtros.in) url.searchParams.set('in', this.filtros.in); else url.searchParams.delete('in');
                    if (this.filtros.out) url.searchParams.set('out', this.filtros.out); else url.searchParams.delete('out');
                    if (this.filtros.pax > 0) url.searchParams.set('pax', this.filtros.pax); else url.searchParams.delete('pax');

                    window.history.pushState({}, '', url);
                    this.aplicarFiltros();
                },

                limpiarFiltros() {
                    this.filtros = { loc: '', in: '', out: '', pax: 0 };
                    this.tempAdults = 0;
                    this.tempChildren = 0;
                    this.tempInfants = 0;
                    this.tempPets = 0;
                    if (this.fp) this.fp.clear();
                    this.aplicarFiltrosYURL();
                },

                aplicarFiltros() {
                    this.propiedadesFiltradas = this.todasPropiedades.filter(prop => {
                        if (this.filtros.pax > 0 && prop.capacidad_huespedes < this.filtros.pax) return false;

                        if (this.filtros.loc && this.filtros.loc !== 'Destino') {
                            const termino = this.filtros.loc.split(',')[0].toLowerCase().trim(); // Busca solo "Chía"
                            const ciudad = (prop.ciudad || '').toLowerCase();
                            const depto = (prop.departamento || '').toLowerCase();
                            if (!ciudad.includes(termino) && !depto.includes(termino)) return false;
                        }

                        return true;
                    });
                },

                textoFechas() {
                    if (!this.filtros.in || !this.filtros.out) return 'Fechas';
                    const meses = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
                    const dIn = new Date(this.filtros.in + "T12:00:00");
                    const dOut = new Date(this.filtros.out + "T12:00:00");
                    return `${dIn.getDate()} ${meses[dIn.getMonth()]} – ${dOut.getDate()} ${meses[dOut.getMonth()]}`;
                },

                formatearDinero(valor) {
                    return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(valor);
                },

                activarNavbarDinamica() {
                    const navbar = document.getElementById('navbar');
                    const logo = document.getElementById('nav-logo-combined');
                    const largoPildora = 'max-w-[850px]';

                    window.addEventListener('scroll', () => {
                        if (window.scrollY > 50) {
                            logo.classList.replace('h-16', 'h-10');
                            navbar.classList.remove('top-0', 'w-full', 'max-w-full', 'h-24', 'rounded-none', 'px-4', 'md:px-10', 'border-b', 'bg-navy/90');
                            navbar.classList.add('top-5', 'w-[95%]', largoPildora, 'h-16', 'rounded-full', 'px-6', 'shadow-[0_20px_40px_rgba(0,0,0,0.3)]', 'border', 'bg-navy/80');
                        } else {
                            logo.classList.replace('h-10', 'h-16');
                            navbar.classList.remove('top-5', 'w-[95%]', largoPildora, 'h-16', 'rounded-full', 'px-6', 'shadow-[0_20px_40px_rgba(0,0,0,0.3)]', 'border', 'bg-navy/80');
                            navbar.classList.add('top-0', 'w-full', 'max-w-full', 'h-24', 'rounded-none', 'px-4', 'md:px-10', 'border-b', 'bg-navy/90');
                        }
                    });
                }
            }
        }
    </script>
</body>

</html>
