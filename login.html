<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - GestandoValor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0B132B', 
                        gold: '#D4AF37', 
                        lightGray: '#F9FAFB'
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans text-gray-800 antialiased bg-navy" x-data="{ openContact: false }">

    <nav id="navbar" class="fixed top-0 left-1/2 transform -translate-x-1/2 z-50 flex items-center justify-between transition-all duration-700 ease-[cubic-bezier(0.25,1,0.5,1)] backdrop-blur-lg overflow-hidden border-white/10 w-full max-w-full h-24 rounded-none px-10 border-b bg-navy">
        <a href="index.html" class="flex items-center transition-all duration-700 flex-shrink-0">
            <img id="nav-logo-combined" src="GV.png" alt="Logo" class="h-16 w-auto object-contain transition-all duration-700">
        </a>
        
        <div class="hidden md:flex items-center gap-6 justify-center flex-1 transition-all duration-700 whitespace-nowrap pl-4 text-gray-300">
            <a href="index.html" class="text-sm font-medium hover:text-gold transition-colors">Inicio</a>
            <a href="blog.html" class="text-sm font-medium hover:text-gold transition-colors">Blog</a>
            <a href="alojamientos.html" class="text-sm font-medium hover:text-gold transition-colors">Alojamientos</a>
            
            <div class="h-5 w-px bg-white/20 ml-2"></div>
            
            <a href="login.html" class="text-sm font-medium text-white border-b-2 border-gold pb-1 ml-2">Iniciar Sesión</a>
        </div>

        <div class="flex items-center gap-4 flex-shrink-0">
            <a href="index.html#contacto" class="bg-gold hover:bg-yellow-500 text-navy text-xs font-bold py-2.5 px-6 rounded-full transition-transform hover:scale-105">Contacto</a>
        </div>
    </nav>

    <section class="relative min-h-screen flex items-center justify-center pt-24 overflow-hidden bg-navy">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80" class="w-full h-full object-cover opacity-10">
        </div>
        
        <div class="relative z-10 w-full max-w-md px-6">
            <div class="bg-white rounded-[40px] p-10 md:p-12 shadow-2xl border border-gray-100 transform transition-all hover:shadow-gold/10 hover:shadow-2xl">
                
                <div class="text-center mb-10">
                    <div class="w-16 h-16 bg-navy rounded-2xl flex items-center justify-center shadow-inner mx-auto mb-6">
                        <svg class="w-8 h-8 text-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    </div>
                    <h1 class="text-3xl font-extrabold text-navy tracking-tight mb-2">Portal GV</h1>
                    <p class="text-gray-500 text-sm">Ingresa a tu espacio de trabajo o inversión.</p>
                </div>

                <form id="loginForm" class="space-y-6">
                    <div>
                        <label for="username" class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2 pl-2">Usuario de Acceso</label>
                        <input type="text" id="username" name="username" placeholder="Ej: carlos_mendoza" class="w-full bg-gray-50 border border-gray-200 rounded-2xl py-4 px-6 text-navy font-medium outline-none focus:border-gold focus:bg-white transition-colors" required>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-2 pl-2 pr-2">
                            <label for="password" class="block text-xs font-bold uppercase tracking-widest text-gray-500">Contraseña</label>
                            <a href="#" class="text-xs font-bold text-gold hover:text-navy transition-colors">¿Olvidaste tu clave?</a>
                        </div>
                        <input type="password" id="password" name="password" placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 rounded-2xl py-4 px-6 text-navy font-medium outline-none focus:border-gold focus:bg-white transition-colors" required>
                    </div>

                    <div id="mensajeError" style="display: none;" class="bg-red-50 text-red-500 text-sm font-bold p-3 rounded-xl border border-red-100 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <span>Usuario o contraseña incorrectos.</span>
                    </div>

                    <div class="pt-4">
                        <button id="btnSubmit" type="submit" class="w-full bg-gold hover:bg-yellow-500 text-navy font-extrabold text-lg py-5 rounded-full shadow-lg transform hover:-translate-y-1 hover:shadow-xl transition-all duration-300 active:scale-95">
                            Acceder al sistema
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Lógica visual del Navbar
            const navbar = document.getElementById('navbar');
            const logo = document.getElementById('nav-logo-combined');
            const largoPildora = 'max-w-[760px]';

            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    logo.classList.replace('h-16', 'h-10'); 
                    navbar.classList.remove('top-0', 'w-full', 'max-w-full', 'h-24', 'rounded-none', 'px-10', 'border-b', 'bg-navy');
                    navbar.classList.add('top-5', 'w-[95%]', largoPildora, 'h-14', 'rounded-full', 'px-6', 'shadow-2xl', 'border', 'bg-navy/50'); 
                } else {
                    logo.classList.replace('h-10', 'h-16');
                    navbar.classList.remove('top-5', 'w-[95%]', largoPildora, 'h-14', 'rounded-full', 'px-6', 'shadow-2xl', 'border', 'bg-navy/50');
                    navbar.classList.add('top-0', 'w-full', 'max-w-full', 'h-24', 'rounded-none', 'px-10', 'border-b', 'bg-navy');
                }
            });

            // LÓGICA DE LOGIN CONECTADA A LA BASE DE DATOS
            const loginForm = document.getElementById('loginForm');
            const btnSubmit = document.getElementById('btnSubmit');
            const mensajeError = document.getElementById('mensajeError');
            
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault(); 
                
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                
                const textoOriginal = btnSubmit.textContent;
                btnSubmit.textContent = 'Verificando...';
                btnSubmit.disabled = true;
                mensajeError.style.display = 'none';

                // ==========================================
                // LLAVE MAESTRA TEMPORAL (Solo por si Render se duerme)
                // ==========================================
                if (username === 'EdwinyMarce' && password === 'Gaby2012') {
                    // Guardamos la sesión en el navegador
                    localStorage.setItem('gv_usuario_actual', JSON.stringify({ nombre: 'Edwin y Marce', rol: 'ADMIN' }));
                    window.location.href = 'admin_dashboard.html';
                    return; 
                }

                try {
                    // 1. Llamamos a tu base de datos en Render
                    const respuesta = await fetch('https://gestandovalor-backend.onrender.com/usuarios/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    if (respuesta.ok) {
                        const data = await respuesta.json();
                        const usuario = data.usuario;

                        // 2. Guardamos quién entró en la memoria del navegador
                        // Así las otras páginas sabrán si decir "Hola, Ricardo" u "Hola, Carlos"
                        localStorage.setItem('gv_usuario_actual', JSON.stringify(usuario));

                        // 3. El Portero de Discoteca: Redirige según el Rol
                        switch(usuario.rol) {
                            case 'ADMIN':
                                window.location.href = 'admin_dashboard.html';
                                break;
                            case 'AMA_LLAVES':
                                window.location.href = 'ama_llaves_dashboard.html';
                                break;
                            case 'ASEO':
                                window.location.href = 'empleado_dashboard.html';
                                break;
                            case 'PROPIETARIO':
                                window.location.href = 'propietario_dashboard.html';
                                break;
                            default:
                                alert('Tu usuario no tiene un rol asignado. Contacta al administrador.');
                                btnSubmit.textContent = textoOriginal;
                                btnSubmit.disabled = false;
                        }
                    } else {
                        // Credenciales incorrectas
                        mensajeError.style.display = 'flex';
                        btnSubmit.textContent = textoOriginal;
                        btnSubmit.disabled = false;
                    }
                } catch (error) {
                    console.error('Error de conexión:', error);
                    alert('El servidor está despertando (Render gratuito). Intenta de nuevo en 30 segundos.');
                    btnSubmit.textContent = textoOriginal;
                    btnSubmit.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
