<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando artículo... - GestandoValor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { navy: '#0B132B', gold: '#D4AF37', lightGray: '#F9FAFB' } } }
        }
    </script>
</head>
<body class="font-sans text-gray-800 antialiased bg-lightGray" x-data="cargadorArticulo()" x-init="init()">

    <nav class="absolute top-0 w-full h-24 z-50 flex items-center justify-between px-6 md:px-10 bg-transparent">
        <a href="index.html"><img src="GV.png" alt="Logo" class="h-16 w-auto object-contain"></a>
        <div class="hidden md:flex items-center gap-6 text-white">
            <a href="index.html" class="text-sm font-medium hover:text-gold transition-colors">Inicio</a>
            <a href="blog.html" class="text-sm font-medium border-b-2 border-gold pb-1">Blog</a>
            <a href="alojamientos.html" class="text-sm font-medium hover:text-gold transition-colors">Alojamientos</a>
        </div>
        <a href="index.html#contacto" class="bg-gold hover:bg-yellow-500 text-navy text-xs font-bold py-2.5 px-6 rounded-full shadow-lg">Contactar</a>
    </nav>

    <div x-show="cargando" class="min-h-screen flex items-center justify-center bg-navy text-white">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-gold"></div>
    </div>

    <div x-show="!cargando && articulo" style="display: none;">
        
        <section class="relative pt-40 pb-32 bg-navy flex items-center justify-center min-h-[60vh]">
            <div class="absolute inset-0 z-0">
                <img :src="articulo?.foto_url || 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=1920&q=80'" class="w-full h-full object-cover opacity-30 mix-blend-overlay">
                <div class="absolute inset-0 bg-gradient-to-t from-lightGray via-transparent to-navy/80"></div>
            </div>
            
            <div class="relative z-10 max-w-4xl mx-auto px-6 text-center pt-20">
                <span class="bg-gold text-navy text-xs font-extrabold uppercase tracking-widest px-4 py-1.5 rounded-full mb-6 inline-block" x-text="articulo?.categoria"></span>
                <h1 class="text-4xl md:text-6xl font-extrabold text-white leading-tight mb-6 drop-shadow-lg" x-text="articulo?.titulo"></h1>
                
                <div class="flex items-center justify-center gap-4 text-white/80 font-medium text-sm">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center border border-white/30 text-white font-bold text-xs">E</div>
                        <span>Por Edwin</span>
                    </div>
                    <span>•</span>
                    <span x-text="formatearFecha(articulo?.created_at)"></span>
                    <span>•</span>
                    <span x-text="`${articulo?.tiempo_lectura} min de lectura`"></span>
                </div>
            </div>
        </section>

        <section class="py-16 bg-lightGray relative z-20 -mt-10">
            <div class="max-w-3xl mx-auto px-6 bg-white p-10 md:p-16 rounded-[40px] shadow-2xl border border-gray-100">
                
                <div class="prose prose-lg prose-headings:text-navy prose-p:text-gray-600 prose-a:text-gold max-w-none leading-relaxed" x-html="formatearTexto(articulo?.contenido)">
                </div>

                <div class="mt-16 bg-navy rounded-3xl p-8 md:p-12 text-center text-white relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-gold/10 rounded-full blur-[80px]"></div>
                    <h3 class="text-2xl font-extrabold mb-4 relative z-10">¿Tienes una propiedad?</h3>
                    <p class="text-gray-300 mb-8 relative z-10">Deja la administración en nuestras manos y maximiza tus ingresos.</p>
                    <a href="index.html#contacto" class="inline-block bg-gold hover:bg-yellow-500 text-navy font-extrabold px-8 py-4 rounded-full transition-transform hover:scale-105 relative z-10 shadow-lg">
                        Contactar a GestandoValor
                    </a>
                </div>
            </div>
        </section>
    </div>

    <div x-show="!cargando && !articulo" style="display: none;" class="min-h-screen flex flex-col items-center justify-center bg-lightGray">
        <h2 class="text-3xl font-bold text-navy mb-4">Artículo no encontrado</h2>
        <a href="blog.html" class="text-gold font-bold hover:underline">Volver al Blog</a>
    </div>

    <script>
        function cargadorArticulo() {
            return {
                cargando: true,
                articulo: null,
                async init() {
                    // Magia: Lee el ID que viene en la URL (ej: articulo.html?id=123)
                    const urlParams = new URLSearchParams(window.location.search);
                    const id = urlParams.get('id');

                    if (!id) {
                        this.cargando = false;
                        return;
                    }

                    try {
                        // Busca ese artículo específico en tu base de datos
                        const response = await fetch(`http://localhost:3000/blog/${id}`);
                        if (response.ok) {
                            this.articulo = await response.json();
                            document.title = `${this.articulo.titulo} - GestandoValor`;
                        }
                    } catch (error) {
                        console.error('Error cargando el blog:', error);
                    } finally {
                        this.cargando = false;
                    }
                },
                formatearFecha(fechaIso) {
                    if(!fechaIso) return '';
                    const opciones = { year: 'numeric', month: 'long', day: 'numeric' };
                    return new Date(fechaIso).toLocaleDateString('es-ES', opciones);
                },
                // Esta función convierte los saltos de línea del texto de Edwin en párrafos HTML reales
                formatearTexto(texto) {
                    if(!texto) return '';
                    return texto.split('\n\n').map(parrafo => `<p>${parrafo.replace(/\n/g, '<br>')}</p>`).join('');
                }
            }
        }
    </script>
</body>
</html>
